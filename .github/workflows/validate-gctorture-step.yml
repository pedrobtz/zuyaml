# Temporary: measure the `step` input from pedrobtz/r-actions#6, now on @v1.
#
# Branched from 9c95f82 -- the exact commit whose gctorture job took 107
# minutes at the hardcoded step of 20 -- with nothing changed but `step`. The
# test suite is identical, so the run time is the measurement.
#
# Delete this file once the PR is merged or closed.

on:
  push:
    branches: [ci/validate-gctorture-step]
  workflow_dispatch:

name: validate-gctorture-step

permissions: read-all

jobs:
  # Expected ~10-12 minutes, from 97.3s -> 11.1s on one test file measured
  # locally. Anything near 107 minutes means the input is not reaching
  # gctorture2().
  gctorture-100:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      step: 100
      timeout-minutes: 180

  # The default must still be 20, so this one should land near the 107-minute
  # baseline. It is the regression test for "no caller gets a less sensitive
  # check from a tag bump".
  gctorture-default:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@v1
    with:
      timeout-minutes: 180
