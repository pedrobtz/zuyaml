# Checks that are too slow or too specialised for the per-push R-CMD-check run.
#
# The C boundary is where this package should be unusually strict: it vendors a
# C library and hands it untrusted input. These jobs are what make the
# robustness claims testable rather than asserted.

on:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    # Weekly, so that a latent problem surfaces without waiting for a push.
    - cron: "0 4 * * 1"
  workflow_dispatch:

name: hardening.yaml

permissions: read-all

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    name: full yaml-test-suite

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::devtools
          needs: check

      - name: Fetch the full suite
        run: tools/fetch-yaml-test-suite.sh "${{ runner.temp }}/yaml-test-suite"

      - name: Run conformance against every case
        env:
          ZUYAML_TEST_SUITE: ${{ runner.temp }}/yaml-test-suite
        run: Rscript tools/ci-run-tests.R

  sanitizers:
    runs-on: ubuntu-latest
    name: ${{ matrix.sanitizer }}

    strategy:
      fail-fast: false
      matrix:
        # Image names come from https://r-hub.github.io/containers/.
        # There is no gcc-san; the sanitizer images are these three.
        sanitizer: [clang-asan, clang-ubsan, gcc-asan]

    container:
      image: ghcr.io/r-hub/containers/${{ matrix.sanitizer }}:latest

    steps:
      - uses: actions/checkout@v6

      - name: Install test dependencies
        run: Rscript -e 'install.packages(c("testthat","withr"))'

      - name: Install the package
        run: R CMD INSTALL .

      - name: Run the test suite under the sanitizer
        # Errors raised mid-conversion unwind past the explicit free, so the
        # error paths are exactly what needs watching here.
        # These containers run `sh -e`, not bash, so `set -o pipefail` is an
        # illegal option and would kill the step before any test runs. Capture
        # to a file and check the status explicitly instead of relying on a
        # pipeline's exit status.
        run: |
          Rscript tools/ci-run-tests.R > sanitizer.log 2>&1
          status=$?
          cat sanitizer.log
          if grep -qiE "runtime error|AddressSanitizer|LeakSanitizer|SUMMARY: .*Sanitizer" sanitizer.log; then
            echo "::error::sanitizer reported a problem"
            exit 1
          fi
          exit $status

  fuzz:
    runs-on: ubuntu-latest
    name: wrapper fuzzing

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ZUYAML_FUZZ: "20000"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::devtools, any::withr
          needs: check

      - name: Fuzz the parser
        run: Rscript tools/ci-run-tests.R fuzz
