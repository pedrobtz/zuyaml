# The checks only this package can express.
#
# The C boundary is where this package should be unusually strict: it vendors a
# C library and hands it untrusted input. These two jobs are what make the
# robustness claims testable rather than asserted, and neither generalises:
# one fetches an external corpus and compares against a pinned baseline, the
# other drives the package's own fuzzer.
#
# The generic native checks -- sanitizers, valgrind, LTO, gctorture, rchk --
# live in native-checks.yaml, which calls the reusable workflows in
# pedrobtz/r-actions rather than keeping a second copy of them here. The
# sanitizer jobs that used to be in this file are three of those.

on:
  push:
    branches: [main, master, develop]
  pull_request:
  schedule:
    # Weekly, so that a latent problem surfaces without waiting for a push.
    - cron: "0 4 * * 1"
  workflow_dispatch:

name: hardening.yaml

permissions: read-all

jobs:
  full-test-suite:
    runs-on: ubuntu-latest
    name: full yaml-test-suite

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::devtools
          needs: check

      - name: Fetch the full suite
        run: tools/fetch-yaml-test-suite.sh "${{ runner.temp }}/yaml-test-suite"

      - name: Run conformance against every case
        env:
          ZUYAML_TEST_SUITE: ${{ runner.temp }}/yaml-test-suite
        run: Rscript tools/ci-run-tests.R

      # The report the assertions cannot give: counts per boundary, every
      # failure named, and a comparison against the baseline pinned in the
      # script. Exits non-zero on a failure or on drift.
      - name: Conformance report
        run: Rscript tools/conformance.R "${{ runner.temp }}/yaml-test-suite"

  fuzz:
    runs-on: ubuntu-latest
    name: wrapper fuzzing

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ZUYAML_FUZZ: "20000"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::devtools, any::withr
          needs: check

      - name: Fuzz the parser
        run: Rscript tools/ci-run-tests.R fuzz
