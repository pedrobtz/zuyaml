# The checks only this package can express.
#
# The C boundary is where this package should be unusually strict: it vendors a
# C library and hands it untrusted input. These two jobs are what make the
# robustness claims testable rather than asserted, and neither generalises:
# one fetches an external corpus and compares against a pinned baseline, the
# other drives the package's own fuzzer.
#
# The generic native checks -- sanitizers, valgrind, LTO, gctorture, rchk --
# live in native-checks.yaml, which calls the reusable workflows in
# pedrobtz/r-actions rather than keeping a second copy of them here. The
# sanitizer jobs that used to be in this file are three of those.

on:
  # No `push:`: a pull request already checks its merge with main,
  # and the schedule checks main (r-actions README, "Pushes to main").
  pull_request:
  schedule:
    # Weekly, so that a latent problem surfaces without waiting for a push.
    - cron: "28 5 * * 6"  # weekly, Saturdays
  workflow_dispatch:

name: hardening.yaml

permissions: read-all

jobs:
  # The r-actions gate: skips the jobs below on a documentation-only change
  # and honours the ci:docs, ci:minimal and skip-ci:hardening labels.
  changes:
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'full-ci')
      || !(contains(github.event.pull_request.labels.*.name, 'ci:docs')
        || contains(github.event.pull_request.labels.*.name, 'ci:minimal')
        || contains(github.event.pull_request.labels.*.name, 'skip-ci:hardening'))
    uses: pedrobtz/r-actions/.github/workflows/changes.yml@v1
    with:
      name: hardening

  full-test-suite:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: full yaml-test-suite

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::devtools
          needs: check

      - name: Fetch the full suite
        run: tools/fetch-yaml-test-suite.sh "${{ runner.temp }}/yaml-test-suite"

      - name: Run conformance against every case
        env:
          ZUYAML_TEST_SUITE: ${{ runner.temp }}/yaml-test-suite
        run: Rscript tools/ci-run-tests.R

      # The report the assertions cannot give: counts per boundary, every
      # failure named, and a comparison against the baseline pinned in the
      # script. Exits non-zero on a failure or on drift.
      - name: Conformance report
        run: Rscript tools/conformance.R "${{ runner.temp }}/yaml-test-suite"

  fuzz:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: wrapper fuzzing

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ZUYAML_FUZZ: "20000"

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, any::devtools, any::withr
          needs: check

      - name: Fuzz the parser
        run: Rscript tools/ci-run-tests.R fuzz

  # Nesting depth against the C stack (#8): the default max_depth must trip
  # first, and running out of stack must be an R error, never a crash. Needs
  # a shell-level `ulimit -s`, which R cannot set for itself, so it lives
  # here rather than in tests/. tools/ci/stack-depth.R says what it checks
  # and reports the measured margin.
  stack:
    needs: changes
    if: ${{ !cancelled() && needs.changes.result != 'skipped' && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    name: nesting depth under 8 MB, 1 MB and 256 KB stacks

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install zufast
        run: Rscript -e 'install.packages("zufast")'

      # --large-output emits a 2.5 GB document, which must be refused with
      # limit_size; the runner has the memory for it.
      - name: Depth and stack
        run: tools/ci/stack-depth.sh --large-output
