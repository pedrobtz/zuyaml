# R CMD check, on the GitHub runners and in the CRAN-like containers, via the
# reusable workflow in pedrobtz/r-actions. That workflow carries the reasoning;
# this file carries only what is specific to this package.
#
# The container half is the reason for the switch. The old matrix had an
# Ubuntu Clang row precisely because this package vendors a C11 parser and
# emitter, and vendored code is written against the compilers upstream tests
# on. But that row was ubuntu-latest's clang, which still defaults to
# __STDC_VERSION__ 201710L, where CRAN's debian-clang leg is clang 23
# building C as -std=gnu23 with -pedantic. It was answering the right question
# with the wrong compiler: the first report of an upstream diagnostic would
# still have been an incoming pretest, which is a rejected submission rather
# than a red check. The containers run CRAN's compilers and CRAN's flags.
#
# No paths-ignore, unlike native-checks.yaml: --as-cran checks the URLs in
# README.md, which ships in the tarball, so a prose-only change is a real
# change here.
#
# No inputs at all: the defaults are taken as they ship.
#
#   - The runners matrix has no R-devel Linux row, which the old one did. It
#     is not missed -- the containers are R-devel on Linux already, on CRAN's
#     own compilers, and pinning R-devel to the runner's own GCC matches no
#     CRAN flavor. Add it back only as insurance against a stale image.
#   - No --compact-vignettes. The old build_args asked for it, but there is
#     nothing to compact: vignettes/articles is .Rbuildignore'd and DESCRIPTION
#     declares no VignetteBuilder, so no vignette ships in the tarball. The
#     articles are built by pkgdown.yaml, which is the only thing that knits
#     them.
on:
  push:
    branches: [main, master, develop]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    uses: pedrobtz/r-actions/.github/workflows/r-cmd-check.yml@v1
    with:
      # CRAN's two configuration flavors, both off by default upstream.
      #
      # nosuggests because this package declares five suggested packages and
      # its whole test suite runs on two of them. CRAN runs that flavor, and
      # what it catches is a test file or example that treats a Suggests as if
      # it were a hard dependency -- which errors there and passes in every
      # other job here.
      #
      # nold because the package converts text to numbers and back, and that
      # is exactly the code that can be correct only by accident of 80-bit
      # intermediates: parsing a float, deciding whether a double is
      # integral, and emitting one so that it parses back unchanged.
      nosuggests: true
      nold: true
