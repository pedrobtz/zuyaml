# Temporary: exercise pedrobtz/r-actions#4 before it is merged.
#
# A `workflow_call` workflow only runs when something calls it, so opening
# that PR proves nothing on its own. This calls the changed workflows from
# the PR branch against a real package with vendored C.
#
# Delete this file once the PR is merged or closed.

on:
  push:
    branches: [ci/validate-r-actions]
  workflow_dispatch:

name: validate-r-actions

permissions: read-all

jobs:
  # UBSan on the runner plus ASan in the containers, from one `uses:`. The
  # asan-run input replaces R CMD check with the package's own base-R driver,
  # which is why zuyaml can use these containers at all: testthat is not in
  # the r-hub binary repository and building it and its dependencies from
  # source under ASan is slow and fragile.
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@asan-and-failing-checks
    with:
      asan: true
      asan-dependencies: false
      asan-run: Rscript tools/sanitizer-exercise.R tests/testthat/fixtures/yaml-test-suite

  # The same containers on the default R CMD check path, which failed on the
  # first validation run because Suggests were not installed. This is the
  # regression test for that fix, and it measures what the path costs.
  sanitizers-default-check:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@asan-and-failing-checks
    with:
      asan: true
      asan-containers: '["clang-asan"]'
      timeout-minutes: 90

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@asan-and-failing-checks
    with:
      timeout-minutes: 90

  # zuyaml is at zero rchk findings, so the opt-in is the point for this
  # package. It failed on the first run against R's own bcEval_loop; this is
  # the regression test for the corrected pattern.
  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@asan-and-failing-checks
    with:
      fail-on-findings: true
